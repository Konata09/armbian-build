# Disable Wi-Fi and Bluetooth kernel modules on Lenovo ECG-AR70P.
# Delete this file and reboot to re-enable Wi-Fi and Bluetooth.

# Onboard AP6256 / Broadcom Wi-Fi
blacklist brcmfmac
blacklist brcmfmac_wcc
blacklist brcmfmac_bca
blacklist brcmfmac_cyw
blacklist brcmsmac
blacklist brcmutil
install brcmfmac /bin/false
install brcmfmac_wcc /bin/false

# Onboard AP6256 / UART / SDIO / USB Bluetooth and protocols
blacklist hci_uart
blacklist btsdio
blacklist btbcm
blacklist btintel
blacklist btrtl
blacklist btqca
blacklist btmtk
blacklist btusb
blacklist rtk_btusb
blacklist btmrvl
blacklist btmrvl_sdio
blacklist btmtksdio
blacklist rfcomm
blacklist bnep
blacklist hidp
blacklist bluetooth_6lowpan
install hci_uart /bin/false
install btsdio /bin/false
install btusb /bin/false
