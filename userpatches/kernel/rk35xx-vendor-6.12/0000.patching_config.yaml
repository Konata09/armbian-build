config: # userpatches/kernel/rk35xx-vendor-6.12/0000.patching_config.yaml

  # Just some info stuff; not used by the patching scripts
  name: rk35xx-vendor-6.12
  kind: kernel
  type: vendor
  branch: rk-6.12-rkr1

  # .dts files in these directories will be copied as-is to the build tree; later ones overwrite earlier ones.
  dts-directories:
    - { source: "dt", target: "arch/arm64/boot/dts/rockchip" }

  # the Makefile in each of these directories will be patched to include the dts files copied in
  auto-patch-dt-makefile:
    - { directory: "arch/arm64/boot/dts/rockchip", config-var: "CONFIG_ARCH_ROCKCHIP", add-only: true }
