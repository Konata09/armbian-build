#
# HiSilicon Ascend 310 (Hi1910): 8x Cortex-A55
#
# The loader in SPI flash (xloader/UEFI) reads the kernel and the DTB from raw
# boot areas on the SD card. Tables at sectors 16-19 point to a main and a
# backup area. The loader can not load an initramfs and runs no boot script,
# so the BSP kernel hook zz-dlap221-boot writes the bootargs into the DTB.
# The LPM3 and TEE firmware in packages/blobs/dlap-221 come from the vendor
# SD card image.
#

declare -g ARCH="arm64"
declare -g LINUXFAMILY="ascend310"
declare -g KERNEL_IMAGE_TYPE="Image"
declare -g KERNEL_EXTRA_CFLAGS="-mtune=cortex-a55"
declare -g IMAGE_PARTITION_TABLE="msdos" # a GPT overwrites the loader tables at sectors 16-19
declare -g OFFSET=80                     # MiB, room for both boot areas before the rootfs
declare -g EXTRA_BSPDEPS="python3"
# BTF also turns on ftrace and kprobes; it grows the Image toward the 32 MiB slot
declare -g KERNEL_BTF="${KERNEL_BTF:-no}"

# boot areas (36 MiB each), in 512-byte sectors
declare -g ASCEND310_BOOT_MAIN=8192    # 4 MiB
declare -g ASCEND310_BOOT_BACKUP=81920 # 40 MiB

case "${BRANCH}" in
	current)
		declare -g KERNEL_MAJOR_MINOR="6.18"
		declare -g KERNELBRANCH="tag:v6.18.58"
		declare -g LINUXCONFIG="linux-ascend310-current"
		;;
esac

declare -g KERNELPATCHDIR="archive/ascend310-${KERNEL_MAJOR_MINOR}"

function post_family_tweaks_bsp__ascend310_boot_tools() {
	display_alert "Adding boot area tools" "${BOARD}" "info"
	local bsp="${USERPATCHES_PATH}/packages/bsp/dlap-221"
	local blobs="${USERPATCHES_PATH}/packages/blobs/dlap-221"
	install -Dm755 "${bsp}/dlap221-boot" "${destination}/usr/sbin/dlap221-boot"
	install -Dm755 "${bsp}/zz-dlap221-boot" "${destination}/etc/kernel/postinst.d/zz-dlap221-boot"
	install -Dm644 "${bsp}/60-dlap221-eth0-rps.rules" "${destination}/etc/udev/rules.d/60-dlap221-eth0-rps.rules"
	install -Dm755 "${bsp}/dlap221-eth0-mac" "${destination}/usr/libexec/dlap221-eth0-mac"
	install -Dm644 "${bsp}/dlap221-eth0-mac.service" "${destination}/usr/lib/systemd/system/dlap221-eth0-mac.service"
	mkdir -p "${destination}/etc/systemd/system/multi-user.target.wants"
	ln -sf /usr/lib/systemd/system/dlap221-eth0-mac.service "${destination}/etc/systemd/system/multi-user.target.wants/dlap221-eth0-mac.service"
	local blob
	for blob in dt-dk.img lpm3.img tee.bin; do
		install -Dm644 "${blobs}/${blob}" "${destination}/usr/share/dlap221-boot/${blob}"
	done
}

# The bsp-cli version hashes the hook source text and the ${SRC}/packages paths it names, but not
# files under userpatches. Put a digest of those files into a hook's text, so a change rebuilds it.
eval "function post_family_tweaks_bsp__ascend310_payload_digest() { : $(cd "${USERPATCHES_PATH}/packages" &&
	find bsp/dlap-221 blobs/dlap-221 -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16); }"

function pre_umount_final_image__ascend310_write_boot_area() {
	display_alert "Writing loader tables and boot areas" "${LOOP}" "info"
	# root by device name: the kernel resolves it without an initramfs
	sed -i "s|^rootdev=.*|rootdev=/dev/mmcblk0p1|" "${MOUNT}/boot/armbianEnv.txt"
	run_host_command_logged python3 "${MOUNT}/usr/sbin/dlap221-boot" init "${LOOP}" \
		--main "${ASCEND310_BOOT_MAIN}" --backup "${ASCEND310_BOOT_BACKUP}" \
		--lpm3 "${MOUNT}/usr/share/dlap221-boot/lpm3.img" --tee "${MOUNT}/usr/share/dlap221-boot/tee.bin"
	run_host_command_logged env DLAP221_DEV="${LOOP}" DLAP221_ROOT="${MOUNT}" \
		DLAP221_TOOL="${MOUNT}/usr/sbin/dlap221-boot" bash "${MOUNT}/etc/kernel/postinst.d/zz-dlap221-boot"
}
